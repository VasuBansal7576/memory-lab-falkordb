[project]
name = "graph-memory-lab"
version = "0.1.0"
description = "Source-backed graph memory, built from scratch with FalkorDB."
requires-python = ">=3.12"
dependencies = [
  "falkordb>=1.2,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "fastembed>=0.7,<1",
  "filelock>=3,<5",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
