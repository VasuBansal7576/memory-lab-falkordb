<!doctype html><html><body><template><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f5f4ef;color:#25362e;font-family:system-ui,sans-serif}.clip{position:absolute;inset:0;width:1920px;height:1080px}.paper{padding:74px 92px;background:#f5f4ef}.kicker{font-size:22px;letter-spacing:3px;text-transform:uppercase;color:#3f6249;font-weight:650;margin:0 0 18px}h1{font-family:ui-serif,Georgia,serif;font-size:68px;letter-spacing:-2px;font-weight:500;margin:0 0 40px;line-height:1.1}h2{font-size:32px;line-height:1.25;margin:0 0 18px}.card{padding:32px 36px;border:1px solid #b9c7bb;border-radius:18px;background:#fffef9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.small{font-size:23px;line-height:1.5;color:#43584a}.quote{font-family:ui-serif,Georgia,serif;font-size:33px;line-height:1.42;margin:0}footer{position:absolute;bottom:38px;left:92px;right:92px;display:flex;justify-content:space-between;font-size:20px;color:#43584a}.pill{display:inline-block;background:#e3ebdf;border-radius:30px;padding:9px 18px;font-size:22px;font-weight:600}table{border-collapse:collapse;width:100%;font-size:28px}th,td{text-align:left;border-bottom:1px solid #bdcabe;padding:22px 18px}th{font-size:22px;text-transform:uppercase;letter-spacing:1px;background:#e8eee3}.num{font-variant-numeric:tabular-nums}.flow{display:flex;align-items:center;gap:16px;font-size:25px;margin:28px 0}.step{flex:1;background:#e6eddf;padding:22px;border-radius:12px;text-align:center}.hero{font-size:74px;font-weight:650;line-height:1.1;margin:18px 0;color:#31533c}.mono{font-family:ui-monospace,monospace;font-size:25px;line-height:1.6;white-space:pre-wrap}.appframe{position:absolute;left:50px;top:210px;width:1820px;height:810px;overflow:hidden;border:1px solid #aebfaf;border-radius:14px}.appframe video{width:1820px;height:810px;object-fit:contain;position:absolute;top:0px}.top{position:absolute;left:70px;top:34px;right:70px}.top h1{font-size:56px;margin-bottom:12px}.top .kicker{font-size:18px}.videofoot{position:absolute;top:165px;left:72px;font-size:23px;color:#43584a}.note{margin-top:22px;font-size:23px;line-height:1.5}.accent{color:#31533c}.failure{border-left:6px solid #b16535;padding-left:22px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:20px}.checks div{padding:24px;background:#e5eddf;border-radius:12px;font-size:25px}#method{position:absolute;inset:0;padding:74px 92px;background:#f5f4ef}</style><div id="method" data-composition-id="method" data-width="1920" data-height="1080" ><p class="kicker">Controlled retrieval pilot · 32 provider attempts</p><h1>Two models. Two methods.</h1><div class="grid"><div class="card"><h2>Without graph</h2><p class="hero">Search + read</p><p class="small">Real local rg and file reads.<br>The model chooses and executes retrieval.<br>Raw tool traces record what actually ran.</p></div><div class="card"><h2>With graph</h2><p class="hero">Graph-only recall</p><p class="small">Native FalkorDB multi-hop context.<br>No BM25, embeddings or distilled-note hits.<br>Model receives source-backed evidence.</p></div></div><div class="card" style="margin-top:28px"><h2>Same 16 synthetic source documents · 6 questions</h2><p class="small">Sol and Luna each run both methods. Approval case repeated 3 times per arm; 8 attempts per cell. Matched low reasoning settings; alternating method order within each model. Prompts, corpus, frozen implementation, traces and provider usage are published.</p></div><footer><span>Memory Lab / FalkorDB + Codex</span><span>04 / 06</span></footer></div><script>{const tl=gsap.timeline({paused:true});tl.fromTo("#method h1",{opacity:0,y:12},{opacity:1,y:0,duration:.45,ease:"power2.out"},0);window.__timelines["method"]=tl;}</script></template></body></html>
